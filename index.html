<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <!-- dialog -->
    <div class="btnDialog">
      <button command="show-modal" commandfor="dialogForm">Add a book</button>
    </div>

    <dialog id="dialogForm">
      <p>Fill this form to add your book</p>

      <!-- book form -->
      <div class="divForm">
        <form action="" id="bookForm">
          <!-- input form -->
          <div class="formInput">
            <div class="inputTitle">
              <label for="title">Title</label>
              <input
                type="text"
                id="title"
                name="title"
                placeholder='ex: "Harry Potter"'
                required
              />
            </div>

            <div class="inputAuthor">
              <label for="author">Author</label>
              <input
                type="text"
                name="author"
                id="author"
                placeholder='ex: "J.K Rowling"'
                required
              />
            </div>

            <div class="inputPage">
              <label for="page">Pages</label>
              <input
                type="number"
                id="page"
                name="page"
                placeholder="ex: 320 pages"
                required
              />
            </div>

            <div class="checkRead">
              <label for="read">Have you read it?</label>
              <input type="checkbox" id="read" name="read" value="true" />
            </div>
          </div>
          <!-- END of input form -->

          <button type="submit">Submit</button>
        </form>
      </div>
      <!-- END of book form -->
    </dialog>
  </body>
</html>
